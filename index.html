<style>
  :root{
    --amber:#ffb000;
    --amber-dim:#7a5200;
    --sky-top:#050810;
    --sky-mid:#0a1226;
    --sky-low:#141c38;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%}
  body{
    font-family:'Inter',system-ui,sans-serif;
    background:var(--sky-top);
    color:#fff;
    overflow-x:hidden;
    overflow-y:auto; /* boards may outgrow short screens — sky & player stay fixed */
    -webkit-tap-highlight-color:transparent;
  }
  .route-btn,.bus-sign,.player,.clock-pill,.hero{
    -webkit-user-select:none;user-select:none;
  }

  /* ---------- NIGHT SCENE ---------- */
  .scene{position:fixed;inset:0;z-index:0;overflow:hidden;
    background:linear-gradient(to bottom,var(--sky-top) 0%,var(--sky-mid) 55%,var(--sky-low) 100%);}

  .stars,.stars2{position:absolute;inset:0;background-repeat:repeat;opacity:.9}
  .stars{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),
    radial-gradient(1px 1px at 90px 70px,rgba(255,255,255,.8),transparent),
    radial-gradient(1.5px 1.5px at 160px 20px,#fff,transparent),
    radial-gradient(1px 1px at 230px 90px,rgba(255,255,255,.6),transparent),
    radial-gradient(1px 1px at 300px 40px,#fff,transparent);
    background-size:340px 120px;animation:twinkle 5s ease-in-out infinite alternate;}
  .stars2{background-image:radial-gradient(1px 1px at 60px 110px,rgba(255,255,255,.7),transparent),
    radial-gradient(1px 1px at 140px 60px,rgba(255,255,255,.5),transparent),
    radial-gradient(1.5px 1.5px at 260px 130px,rgba(255,255,255,.9),transparent);
    background-size:420px 180px;animation:twinkle 7s ease-in-out infinite alternate-reverse;}
  @keyframes twinkle{from{opacity:.5}to{opacity:1}}

  .moon{position:absolute;top:9vh;right:12vw;width:64px;height:64px;border-radius:50%;
    background:radial-gradient(circle at 38% 38%,#fdf6d8,#e8dca8 60%,#cfc48e);
    box-shadow:0 0 40px 12px rgba(253,246,216,.25),0 0 120px 40px rgba(253,246,216,.08);
    transition:transform 2.5s ease,box-shadow 2.5s ease,filter 2.5s ease}
  body.theme-nilamail .moon{transform:scale(1.6);
    box-shadow:0 0 70px 24px rgba(253,246,216,.4),0 0 180px 70px rgba(253,246,216,.14)}
  body.theme-kanavu .moon{filter:hue-rotate(230deg) saturate(.7) brightness(1.05);
    box-shadow:0 0 50px 16px rgba(200,160,255,.35),0 0 140px 50px rgba(190,120,255,.12)}

  /* per-route sky tints (crossfade on boarding) */
  .tint{position:absolute;inset:0;opacity:0;transition:opacity 2.5s ease;pointer-events:none}
  .tint.nilamail{background:linear-gradient(to bottom,rgba(150,180,225,.12) 0%,rgba(90,130,190,.14) 45%,rgba(20,40,80,.22) 100%)}
  .tint.kanavu{background:linear-gradient(160deg,rgba(130,60,190,.30) 0%,rgba(210,90,170,.16) 45%,rgba(45,20,90,.32) 100%)}
  body.theme-nilamail .tint.nilamail{opacity:1}
  body.theme-kanavu .tint.kanavu{opacity:1}

  /* moonlit clouds — Nila Mail */
  .clouds{position:absolute;top:5vh;left:0;right:0;height:32vh;opacity:0;transition:opacity 2.5s ease;
    pointer-events:none;filter:blur(7px);background-repeat:repeat-x;
    background-image:radial-gradient(ellipse 190px 42px at 210px 90px,rgba(215,228,255,.22),transparent 70%),
      radial-gradient(ellipse 240px 54px at 520px 150px,rgba(215,228,255,.15),transparent 70%),
      radial-gradient(ellipse 170px 38px at 820px 60px,rgba(215,228,255,.18),transparent 70%);
    background-size:1040px 32vh;animation:scroll-clouds 85s linear infinite}
  body.theme-nilamail .clouds{opacity:1}
  @keyframes scroll-clouds{to{background-position-x:-1040px}}

  /* shooting stars — Kanavu Express */
  .shoot{position:absolute;width:120px;height:2px;border-radius:2px;pointer-events:none;opacity:0;
    background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,0));transform:rotate(-28deg)}
  body.theme-kanavu .shoot{animation:shoot 6s linear infinite}
  .shoot.s1{top:9vh;left:68vw}
  .shoot.s2{top:24vh;left:30vw;animation-delay:2.2s}
  .shoot.s3{top:5vh;left:42vw;animation-delay:4.1s}
  @keyframes shoot{
    0%{opacity:0;transform:translate(0,0) rotate(-28deg)}
    4%{opacity:.9}
    11%{opacity:0;transform:translate(-270px,144px) rotate(-28deg)}
    100%{opacity:0;transform:translate(-270px,144px) rotate(-28deg)}}

  /* fireflies — Kanavu Express */
  .fly{position:absolute;width:4px;height:4px;border-radius:50%;pointer-events:none;
    background:#ffe9a8;box-shadow:0 0 9px 3px rgba(255,220,130,.75);opacity:0;transition:opacity 2.5s ease}
  body.theme-kanavu .fly{opacity:.85;animation:drift 8s ease-in-out infinite alternate}
  .fly.f1{bottom:22vh;left:16vw}
  .fly.f2{bottom:30vh;left:38vw;animation-delay:1.3s;animation-duration:10s}
  .fly.f3{bottom:18vh;left:63vw;animation-delay:2.6s;animation-duration:7s}
  .fly.f4{bottom:34vh;left:82vw;animation-delay:.7s;animation-duration:11s}
  @keyframes drift{from{transform:translate(0,0)}to{transform:translate(34px,-46px)}}

  /* Kaadhal Deluxe — warm sepia-rose, like old film */
  .tint.kaadhal{background:linear-gradient(160deg,rgba(190,110,60,.22) 0%,rgba(200,90,90,.16) 45%,rgba(70,25,20,.30) 100%)}
  body.theme-kaadhal .tint.kaadhal{opacity:1}
  body.theme-kaadhal .moon{filter:sepia(.45) saturate(1.25) hue-rotate(-12deg) brightness(1.05);
    box-shadow:0 0 50px 16px rgba(255,190,120,.4),0 0 140px 50px rgba(255,170,100,.14)}

  /* falling petals + old-film scratches — Kaadhal Deluxe */
  .petal{position:absolute;top:-6vh;width:10px;height:14px;pointer-events:none;opacity:0;
    border-radius:60% 40% 55% 45%/60% 45% 55% 40%;
    background:linear-gradient(135deg,#f5c3c8,#e08a96)}
  body.theme-kaadhal .petal{animation:petalfall linear infinite}
  .petal.p1{left:12vw;animation-duration:11s}
  .petal.p2{left:30vw;animation-duration:14s;animation-delay:3s}
  .petal.p3{left:52vw;animation-duration:10s;animation-delay:6s}
  .petal.p4{left:68vw;animation-duration:13s;animation-delay:1.5s}
  .petal.p5{left:85vw;animation-duration:12s;animation-delay:8s}
  @keyframes petalfall{
    0%{opacity:0;transform:translate(0,-4vh) rotate(0deg)}
    8%{opacity:.85}
    50%{transform:translate(5vw,52vh) rotate(210deg)}
    92%{opacity:.7}
    100%{opacity:0;transform:translate(-3vw,110vh) rotate(430deg)}}
  .scratch{position:absolute;top:0;bottom:0;width:1px;pointer-events:none;opacity:0;
    background:rgba(255,240,220,.09)}
  .scratch.c1{left:31vw}
  .scratch.c2{left:73vw}
  body.theme-kaadhal .scratch{animation:scratchflick 7s steps(1) infinite}
  .scratch.c2{animation-delay:3.4s}
  @keyframes scratchflick{
    0%,4%{opacity:0}5%,7%{opacity:1}8%,36%{opacity:0}
    37%,38%{opacity:.7}39%,71%{opacity:0}72%,73%{opacity:1}74%,100%{opacity:0}}

  /* midnight route — deep dark tint */
  .tint.midnight{background:linear-gradient(to bottom,rgba(4,2,18,.48) 0%,rgba(14,8,38,.36) 50%,rgba(0,0,0,.55) 100%)}
  body.theme-midnight .tint.midnight{opacity:1}
  body.theme-midnight .moon{filter:brightness(.7) saturate(.6);
    box-shadow:0 0 30px 8px rgba(200,210,255,.18),0 0 90px 30px rgba(200,210,255,.05)}

  /* rain night (random visits) */
  .rainlayer{position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity 2.5s ease;overflow:hidden}
  .rainlayer::before,.rainlayer::after{content:'';position:absolute;inset:-30% -10% 0 -10%}
  .rainlayer::before{
    background-image:repeating-linear-gradient(78deg,transparent 0 16px,rgba(190,210,255,.28) 16px 17px,transparent 17px 33px);
    animation:rainfall .7s linear infinite}
  .rainlayer::after{
    background-image:repeating-linear-gradient(75deg,transparent 0 23px,rgba(190,210,255,.16) 23px 24px,transparent 24px 47px);
    animation:rainfall 1.1s linear infinite}
  @keyframes rainfall{to{background-position:-14px 66px}}
  body.rain .rainlayer{opacity:.55}
  body.rain .stars,body.rain .stars2{opacity:.22}
  body.rain .moon{filter:brightness(.7) blur(1px)}
  body.rain .road::after{content:'';position:absolute;inset:0;
    background:linear-gradient(to bottom,rgba(190,210,255,.07),transparent 60%),
      repeating-linear-gradient(90deg,transparent 0 110px,rgba(255,195,105,.06) 110px 150px,transparent 150px 260px)}

  /* lightning (rain nights only) */
  .lightning{position:absolute;inset:0;pointer-events:none;opacity:0;
    background:radial-gradient(ellipse at 50% -10%,rgba(225,235,255,.95) 0%,rgba(185,205,255,.4) 42%,transparent 75%)}
  .lightning.flash{animation:skyflash 1s ease-out}
  @keyframes skyflash{
    0%{opacity:0}4%{opacity:.9}10%{opacity:.08}
    16%{opacity:.65}26%{opacity:.12}38%{opacity:.3}100%{opacity:0}}
  .bolt{position:absolute;top:0;width:60px;height:46vh;left:50vw;opacity:0;pointer-events:none;
    filter:drop-shadow(0 0 9px rgba(205,222,255,.95))}
  .bolt.strike{animation:strike .55s ease-out}
  @keyframes strike{0%{opacity:0}7%{opacity:1}17%{opacity:.15}25%{opacity:.85}100%{opacity:0}}

  /* passing headlights */
  .traffic{position:absolute;left:0;right:0;bottom:3.2vh;height:10vh;pointer-events:none;z-index:1}
  .headlights{position:absolute;bottom:1.2vh;left:0;display:flex;gap:9px;opacity:0;transform:translateX(108vw) scale(.5)}
  .headlights i{width:9px;height:9px;border-radius:50%;
    background:radial-gradient(circle,#fff8e0 20%,#ffd98a 60%,transparent 75%);
    box-shadow:0 0 14px 5px rgba(255,225,150,.75),0 0 46px 18px rgba(255,215,130,.22)}
  .traffic.pass .headlights{animation:passby 1.7s ease-in forwards}
  @keyframes passby{
    0%{opacity:0;transform:translateX(108vw) scale(.5)}
    10%{opacity:1}
    82%{opacity:1}
    100%{opacity:0;transform:translateX(-16vw) scale(1.25)}}

  /* cassette eject / insert */
  .cassette.eject{animation:eject .38s ease-in forwards}
  .cassette.insert{animation:insert .5s cubic-bezier(.2,.8,.3,1.12) forwards}
  @keyframes eject{to{transform:translateY(30px) rotate(4deg);opacity:0}}
  @keyframes insert{from{transform:translateY(-36px) rotate(-3deg);opacity:0}to{transform:translateY(0) rotate(0);opacity:1}}
  .clabel::before{transition:background 1.2s ease}
  body.theme-nilamail .clabel::before{background:linear-gradient(90deg,#a9c0ea,#6683c4)}
  body.theme-kanavu .clabel::before{background:linear-gradient(90deg,#d87ec7,#8f52d2)}
  body.theme-kaadhal .clabel::before{background:linear-gradient(90deg,#e0685e,#a3322b)}
  body.theme-midnight .clabel::before{background:linear-gradient(90deg,#463d78,#1b1538)}

  /* rotary volume knob */
  .knob-vol{position:relative;width:40px;height:40px;border-radius:50%;flex-shrink:0;cursor:grab;touch-action:none;
    background:radial-gradient(circle at 35% 30%,#3c4356,#161a25 72%);
    border:1px solid rgba(255,255,255,.25);
    box-shadow:0 3px 10px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.2)}
  .knob-vol:active{cursor:grabbing}
  .knob-vol .ind{position:absolute;inset:0;transform:rotate(var(--rot,81deg))}
  .knob-vol .ind::before{content:'';position:absolute;top:4px;left:50%;width:3px;height:10px;margin-left:-1.5px;
    border-radius:2px;background:var(--amber);box-shadow:0 0 6px rgba(255,176,0,.85)}
  .moon::after{content:'';position:absolute;inset:0;border-radius:50%;
    background:radial-gradient(circle at 68% 30%,rgba(0,0,0,.08) 6px,transparent 7px),
      radial-gradient(circle at 40% 62%,rgba(0,0,0,.07) 9px,transparent 10px);}

  .layer{position:absolute;left:0;right:0;bottom:0;background-repeat:repeat-x;pointer-events:none;
    animation-play-state:paused;transition:opacity 6s ease}
  /* far skyline (with a distant gopuram): slow */
  .skyline-far{height:26vh;opacity:.75;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='260' viewBox='0 0 1200 260'><g fill='%23070c1c'><rect x='30' y='120' width='90' height='140'/><rect x='140' y='80' width='60' height='180'/><polygon points='214,260 214,208 220,208 223,190 229,190 233,172 240,160 247,172 251,190 257,190 260,208 266,208 266,260'/><circle cx='240' cy='155' r='4'/><rect x='268' y='150' width='62' height='110'/><rect x='360' y='100' width='70' height='160'/><polygon points='455,260 455,150 465,150 468,122 476,122 482,96 490,96 496,72 505,58 514,72 520,96 528,96 534,122 542,122 545,150 555,150 555,260'/><circle cx='505' cy='52' r='5'/><rect x='600' y='90' width='55' height='170'/><rect x='680' y='140' width='95' height='120'/><rect x='730' y='118' width='26' height='142'/><polygon points='727,118 759,118 743,94'/><rect x='741' y='76' width='4' height='16'/><rect x='735' y='82' width='16' height='4'/><rect x='800' y='110' width='65' height='150'/><rect x='890' y='160' width='120' height='100'/><circle cx='945' cy='158' r='24'/><rect x='943' y='126' width='3' height='12'/><rect x='1002' y='100' width='10' height='160'/><circle cx='1007' cy='95' r='8'/><rect x='1040' y='95' width='75' height='165'/><polygon points='1128,260 1128,220 1133,220 1136,204 1141,204 1144,190 1150,180 1156,190 1159,204 1164,204 1167,220 1172,220 1172,260'/><circle cx='1150' cy='176' r='3'/></g><g fill='%23ffcf6e' opacity='.5'><rect x='45' y='135' width='6' height='8'/><rect x='75' y='160' width='6' height='8'/><rect x='155' y='95' width='6' height='8'/><rect x='170' y='130' width='6' height='8'/><rect x='245' y='165' width='6' height='8'/><rect x='380' y='115' width='6' height='8'/><rect x='395' y='150' width='6' height='8'/><rect x='500' y='90' width='10' height='5' opacity='.7'/><rect x='494' y='128' width='22' height='5' opacity='.55'/><rect x='615' y='105' width='6' height='8'/><rect x='700' y='155' width='6' height='8'/><rect x='730' y='185' width='6' height='8'/><rect x='815' y='125' width='6' height='8'/><rect x='920' y='175' width='6' height='8'/><rect x='1055' y='110' width='6' height='8'/><rect x='1070' y='145' width='6' height='8'/></g></svg>");
    background-size:1200px 26vh;animation:scroll 90s linear infinite;animation-play-state:paused}
  /* near buildings + shops + palms: faster */
  .skyline-near{height:20vh;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='200' viewBox='0 0 1400 200'><g fill='%23030614'><rect x='60' y='60' width='150' height='140'/><rect x='260' y='100' width='120' height='100'/><rect x='430' y='40' width='90' height='160'/><rect x='570' y='110' width='170' height='90'/><rect x='790' y='70' width='110' height='130'/><rect x='950' y='120' width='150' height='80'/><rect x='1150' y='55' width='120' height='145'/></g><g stroke='%23030614' fill='none' stroke-linecap='round'><path d='M410 200 C408 170 412 140 406 118' stroke-width='6'/><path d='M406 118 C394 110 382 110 371 117' stroke-width='4'/><path d='M406 118 C399 104 388 98 375 99' stroke-width='4'/><path d='M406 118 C412 104 422 98 435 99' stroke-width='4'/><path d='M406 118 C418 110 429 111 439 118' stroke-width='4'/><path d='M406 118 C404 106 402 99 401 93' stroke-width='4'/><path d='M1330 200 C1328 174 1332 148 1326 128' stroke-width='6'/><path d='M1326 128 C1315 121 1304 121 1294 127' stroke-width='4'/><path d='M1326 128 C1320 115 1310 109 1298 110' stroke-width='4'/><path d='M1326 128 C1331 115 1341 109 1353 110' stroke-width='4'/><path d='M1326 128 C1337 121 1347 122 1356 128' stroke-width='4'/></g><g fill='%23ffd98a' opacity='.35'><rect x='80' y='80' width='10' height='12'/><rect x='120' y='80' width='10' height='12'/><rect x='160' y='110' width='10' height='12'/><rect x='285' y='120' width='10' height='12'/><rect x='450' y='60' width='10' height='12'/><rect x='480' y='95' width='10' height='12'/><rect x='600' y='130' width='10' height='12'/><rect x='660' y='130' width='10' height='12'/><rect x='815' y='90' width='10' height='12'/><rect x='980' y='140' width='10' height='12'/><rect x='1180' y='75' width='10' height='12'/><rect x='1215' y='110' width='10' height='12'/></g></svg>");
    background-size:1400px 20vh;animation:scroll 45s linear infinite;animation-play-state:paused}
  /* countryside: rolling hills far, trees and shrubs near */
  .country-far{height:26vh;opacity:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='260' viewBox='0 0 1200 260'><path d='M0 260 L0 180 Q150 105 320 160 Q480 210 640 150 Q800 95 960 170 Q1080 222 1200 165 L1200 260 Z' fill='%23070c1c'/><polygon points='848,140 850,114 855,114 857,102 862,93 867,102 869,114 874,114 876,140' fill='%23070c1c'/><circle cx='862' cy='89' r='3' fill='%23070c1c'/><ellipse cx='320' cy='156' rx='26' ry='14' fill='%23070c1c'/><ellipse cx='660' cy='150' rx='22' ry='12' fill='%23070c1c'/><ellipse cx='950' cy='166' rx='24' ry='13' fill='%23070c1c'/><path d='M0 260 L0 222 Q200 178 400 210 Q600 240 800 205 Q1000 178 1200 220 L1200 260 Z' fill='%23040812'/></svg>");
    background-size:1200px 26vh;animation:scroll-far 90s linear infinite;animation-play-state:paused}
  .country-near{height:20vh;opacity:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='200' viewBox='0 0 1400 200'><g fill='%23030614'><rect x='118' y='110' width='11' height='90'/><ellipse cx='123' cy='84' rx='52' ry='42'/><ellipse cx='305' cy='184' rx='42' ry='18'/><ellipse cx='420' cy='188' rx='30' ry='14'/><rect x='560' y='58' width='9' height='142'/><ellipse cx='545' cy='56' rx='24' ry='10'/><ellipse cx='584' cy='54' rx='24' ry='10'/><ellipse cx='565' cy='40' rx='12' ry='18'/><ellipse cx='700' cy='186' rx='38' ry='16'/><rect x='855' y='96' width='12' height='104'/><ellipse cx='861' cy='70' rx='58' ry='46'/><ellipse cx='1010' cy='186' rx='30' ry='13'/><rect x='1148' y='124' width='10' height='76'/><ellipse cx='1153' cy='102' rx='42' ry='33'/><ellipse cx='1300' cy='188' rx='36' ry='14'/></g></svg>");
    background-size:1400px 20vh;animation:scroll 45s linear infinite;animation-play-state:paused}

  /* village: low tiled houses, water tank, small gopuram, coconut palms */
  .village-far{height:26vh;opacity:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1200' height='260' viewBox='0 0 1200 260'><g fill='%23070c1c'><rect x='90' y='216' width='64' height='44'/><polygon points='84,216 160,216 122,192'/><rect x='300' y='170' width='6' height='90'/><rect x='348' y='170' width='6' height='90'/><rect x='292' y='140' width='70' height='34' rx='9'/><rect x='396' y='216' width='40' height='44'/><circle cx='416' cy='212' r='13'/><rect x='414' y='192' width='3' height='9'/><rect x='442' y='204' width='6' height='56'/><circle cx='445' cy='200' r='4'/><rect x='470' y='222' width='56' height='38'/><polygon points='465,222 531,222 498,200'/><polygon points='620,260 620,196 628,196 631,178 637,178 641,160 648,148 655,160 659,178 665,178 668,196 676,196 676,260'/><circle cx='648' cy='143' r='4'/><rect x='790' y='96' width='7' height='164'/><ellipse cx='779' cy='94' rx='18' ry='8'/><ellipse cx='808' cy='92' rx='18' ry='8'/><ellipse cx='794' cy='82' rx='9' ry='14'/><rect x='900' y='218' width='60' height='42'/><polygon points='894,218 966,218 930,196'/><rect x='1060' y='224' width='52' height='36'/><polygon points='1055,224 1117,224 1086,204'/><polygon points='196,260 196,226 201,226 204,210 209,210 212,196 218,186 224,196 227,210 232,210 235,226 240,226 240,260'/><circle cx='218' cy='182' r='3'/><rect x='1146' y='206' width='20' height='54'/><polygon points='1143,206 1169,206 1156,188'/><rect x='1154' y='174' width='4' height='12'/><rect x='1150' y='178' width='12' height='4'/></g><g fill='%23ffcf6e' opacity='.5'><rect x='108' y='228' width='7' height='9'/><rect x='487' y='232' width='7' height='9'/><rect x='918' y='228' width='7' height='9'/><rect x='1076' y='234' width='6' height='8'/></g></svg>");
    background-size:1200px 26vh;animation:scroll-far 90s linear infinite;animation-play-state:paused}
  .village-near{height:20vh;opacity:0;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='1400' height='200' viewBox='0 0 1400 200'><g fill='%23030614'><rect x='70' y='120' width='120' height='80'/><polygon points='60,120 200,120 130,84'/><rect x='340' y='96' width='9' height='104'/><ellipse cx='328' cy='94' rx='19' ry='8'/><ellipse cx='360' cy='92' rx='19' ry='8'/><ellipse cx='345' cy='80' rx='10' ry='15'/><rect x='470' y='134' width='96' height='66'/><polygon points='462,134 574,134 518,102'/><path d='M760 200 L760 150 Q800 116 840 150 L840 200 Z'/><rect x='930' y='170' width='36' height='30'/><path d='M928 170 Q948 148 968 170 Z'/><rect x='946' y='142' width='3' height='8'/><rect x='1020' y='126' width='110' height='74'/><polygon points='1010,126 1140,126 1075,92'/><rect x='1280' y='142' width='8' height='58'/><ellipse cx='1284' cy='124' rx='32' ry='26'/></g><g fill='%23ffd98a' opacity='.4'><rect x='100' y='140' width='11' height='13'/><rect x='150' y='140' width='11' height='13'/><rect x='495' y='152' width='10' height='12'/><rect x='535' y='152' width='10' height='12'/><rect x='790' y='162' width='10' height='12'/><rect x='1048' y='146' width='11' height='13'/><rect x='1095' y='146' width='11' height='13'/></g></svg>");
    background-size:1400px 20vh;animation:scroll 45s linear infinite;animation-play-state:paused}

  /* journey zones: absent class = city; crossfade 6s via .layer transition */
  body.zone-country .skyline-far,body.zone-country .skyline-near,
  body.zone-country .streetlights,
  body.zone-village .skyline-far,body.zone-village .skyline-near{opacity:0}
  body.zone-country .country-far{opacity:.75}
  body.zone-country .country-near{opacity:1}
  body.zone-village .village-far{opacity:.75}
  body.zone-village .village-near{opacity:1}

  /* streetlight poles: fastest */
  .streetlights{height:34vh;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='700' height='340' viewBox='0 0 700 340'><rect x='348' y='60' width='5' height='280' fill='%23020409'/><rect x='320' y='55' width='62' height='7' rx='3' fill='%23020409'/><circle cx='330' cy='68' r='7' fill='%23ffc966'/><circle cx='330' cy='68' r='16' fill='%23ffc966' opacity='.25'/><circle cx='330' cy='68' r='30' fill='%23ffc966' opacity='.08'/></svg>");
    background-size:700px 34vh;animation:scroll 12s linear infinite;animation-play-state:paused}
  @keyframes scroll{from{background-position-x:0}to{background-position-x:-1400px}}
  .skyline-far{animation-name:scroll-far}
  @keyframes scroll-far{from{background-position-x:0}to{background-position-x:-1200px}}
  .streetlights{animation-name:scroll-street}
  @keyframes scroll-street{from{background-position-x:0}to{background-position-x:-700px}}

  /* road */
  .road{position:absolute;left:0;right:0;bottom:0;height:9vh;background:linear-gradient(to bottom,#0b0e18,#06080f)}
  .road::before{content:'';position:absolute;left:0;right:0;top:45%;height:4px;
    background-image:linear-gradient(90deg,#c9a94e 0 60px,transparent 60px 140px);
    background-size:140px 4px;opacity:.55;animation:lane .55s linear infinite;
    animation-play-state:paused}
  @keyframes lane{from{background-position-x:0}to{background-position-x:-140px}}

  /* the world only moves while the bus does (music playing) */
  body.moving .layer,body.moving .road::before{animation-play-state:running}
  /* …except at a railway crossing, where everyone waits */
  body.halted .layer,body.halted .road::before{animation-play-state:paused!important}

  /* ---------- LEVEL CROSSING ---------- */
  .crossing{position:fixed;right:-45vw;bottom:8.5vh;z-index:4;width:26vw;min-width:230px;height:32vh;
    pointer-events:none;transition:right 2.2s ease-out}
  .crossing.in{right:5vw}
  .crossing.out{transition:right 1.6s ease-in;right:125vw}
  .cr-post{position:absolute;right:0;bottom:0;width:11px;height:28vh;
    background:linear-gradient(90deg,#232836,#12151f);border:1px solid #3a4152;border-radius:3px}
  .cr-lamp{position:absolute;top:7px;left:50%;transform:translateX(-50%);width:13px;height:13px;
    border-radius:50%;background:#e33;opacity:.2}
  .crossing.in .cr-lamp{animation:crlamp .85s steps(2) infinite}
  @keyframes crlamp{50%{opacity:1;box-shadow:0 0 14px 5px rgba(255,60,60,.55)}}
  .cr-pole{position:absolute;right:8px;bottom:calc(28vh - 14px);width:24vw;min-width:210px;height:9px;
    border-radius:5px;transform-origin:right center;transform:rotate(75deg);
    transition:transform 1.3s ease;
    background:repeating-linear-gradient(90deg,#e8e0d0 0 26px,#c0392b 26px 52px);
    box-shadow:0 2px 8px rgba(0,0,0,.5)}
  .crossing.closed .cr-pole{transform:rotate(0deg)}

  .train{position:fixed;left:0;bottom:14vh;z-index:3;width:240vw;height:60px;pointer-events:none;
    opacity:0;transform:translateX(120vw);
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='60' viewBox='0 0 180 60'><rect x='3' y='10' width='174' height='40' rx='6' fill='%23101528'/><rect x='8' y='50' width='164' height='5' fill='%23070b16'/><g fill='%23ffd98a' opacity='.85'><rect x='16' y='20' width='20' height='14' rx='2'/><rect x='48' y='20' width='20' height='14' rx='2'/><rect x='80' y='20' width='20' height='14' rx='2'/><rect x='112' y='20' width='20' height='14' rx='2'/><rect x='144' y='20' width='20' height='14' rx='2'/></g></svg>");
    background-repeat:repeat-x;background-size:180px 60px}
  .train.rtl{animation:train-rtl 5.6s linear forwards}
  .train.ltr{animation:train-ltr 5.6s linear forwards}
  @keyframes train-rtl{from{opacity:1;transform:translateX(115vw)}to{opacity:1;transform:translateX(-245vw)}}
  @keyframes train-ltr{from{opacity:1;transform:translateX(-245vw)}to{opacity:1;transform:translateX(115vw)}}

  .vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%),
      linear-gradient(to bottom,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.45));}

  /* ---------- CHROME ---------- */
  .topbar{position:fixed;top:18px;left:0;right:0;z-index:20;display:flex;justify-content:center;pointer-events:none}
  .clock-pill{display:inline-flex;align-items:center;gap:9px;padding:7px 16px 7px 12px;border-radius:999px;
    background:rgba(255,255,255,.07);backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.14);
    font-size:13px;font-weight:500;pointer-events:auto}
  .dot{position:relative;width:9px;height:9px}
  .dot .ping{position:absolute;inset:0;border-radius:50%;background:var(--amber);opacity:.7;animation:ping 1.6s cubic-bezier(0,0,.2,1) infinite}
  .dot .core{position:absolute;inset:0;border-radius:50%;background:var(--amber);box-shadow:0 0 8px rgba(255,176,0,.9)}
  @keyframes ping{75%,100%{transform:scale(2.4);opacity:0}}
  .clock-pill .svc{color:rgba(255,255,255,.65)}
  .clock-pill time{font-variant-numeric:tabular-nums}
  .clock-pill .riders{color:rgba(255,255,255,.6);font-variant-numeric:tabular-nums}
  .clock-pill .riders:empty{display:none}

  /* ---------- WINDOW POV: frame + sliding glass ---------- */
  :root{--bf-x:clamp(10px,1.8vw,20px);--bf-t:clamp(8px,1.4vh,14px);--bf-b:clamp(14px,2.4vh,26px)}
  .busframe{position:fixed;inset:0;z-index:6;pointer-events:none}
  .bf-l,.bf-r{position:absolute;top:0;bottom:0;width:var(--bf-x)}
  .bf-l{left:0;background:linear-gradient(90deg,#1c212e,#272e40 55%,#0a0d15)}
  .bf-r{right:0;background:linear-gradient(270deg,#1c212e,#272e40 55%,#0a0d15)}
  .bf-t{position:absolute;left:0;right:0;top:0;height:var(--bf-t);
    background:linear-gradient(180deg,#232939,#141926 70%,#0a0d15)}
  .bf-b{position:absolute;left:0;right:0;bottom:0;height:var(--bf-b);
    background:linear-gradient(0deg,#1a1f2c,#2b3245 65%,#3a4258 92%,#12151f);
    box-shadow:0 -1px 0 rgba(255,255,255,.14)} /* sill highlight — the armrest edge */
  .bf-shadow{position:absolute;left:var(--bf-x);right:var(--bf-x);top:var(--bf-t);bottom:var(--bf-b);
    border-radius:14px;box-shadow:inset 0 0 26px rgba(0,0,0,.55),inset 0 0 4px rgba(0,0,0,.6)}
  /* the two iron safety bars across the lower window (inside the glass) */
  .bf-bar{position:fixed;left:var(--bf-x);right:var(--bf-x);height:5px;z-index:7;pointer-events:none;
    background:linear-gradient(180deg,#454d61,#232836 55%,#0f1219);border-radius:3px;
    box-shadow:0 2px 5px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.16)}
  .bf-bar.b1{bottom:calc(var(--bf-b) + 14vh)}
  .bf-bar.b2{bottom:calc(var(--bf-b) + 20.5vh)}
  /* squeeze-latches on the side frames — they work */
  .bf-latch{position:fixed;z-index:8;top:45%;width:15px;height:48px;padding:0;cursor:pointer;
    pointer-events:auto;border:1px solid rgba(255,255,255,.14);
    background:linear-gradient(90deg,#4a5266,#6d7690 40%,#2c3242);
    box-shadow:2px 2px 7px rgba(0,0,0,.45)}
  .bf-latch.l{left:var(--bf-x);border-radius:0 7px 7px 0;border-left:none}
  .bf-latch.r{right:var(--bf-x);border-radius:7px 0 0 7px;border-right:none;
    background:linear-gradient(270deg,#4a5266,#6d7690 40%,#2c3242)}
  .bf-latch::before{content:'';position:absolute;left:3px;right:3px;top:9px;height:2px;
    background:rgba(0,0,0,.4);box-shadow:0 6px 0 rgba(0,0,0,.4),0 12px 0 rgba(0,0,0,.4)}
  .bf-latch::after{content:'';position:absolute;left:50%;bottom:7px;width:6px;height:6px;
    margin-left:-3px;border-radius:50%;background:#151924;box-shadow:inset 0 1px 1px rgba(0,0,0,.8)}
  .bf-latch:active{filter:brightness(1.25)}

  .winglass{position:fixed;inset:0;z-index:5;pointer-events:none;
    transform:translateX(103%);transition:transform .95s cubic-bezier(.45,0,.2,1);
    background:
      linear-gradient(105deg,transparent 8%,rgba(195,215,245,.075) 26%,transparent 40%,
        rgba(195,215,245,.05) 58%,transparent 72%,rgba(195,215,245,.06) 88%,transparent 96%),
      linear-gradient(180deg,rgba(165,190,225,.05),rgba(150,175,210,.035));
    backdrop-filter:blur(1.3px) brightness(.95) saturate(.92);
    -webkit-backdrop-filter:blur(1.3px) brightness(.95) saturate(.92)}
  .winglass::before{content:'';position:absolute;left:0;top:0;bottom:0;width:8px;
    background:linear-gradient(90deg,#39404f,#5a6275 45%,#22293a);
    box-shadow:2px 0 6px rgba(0,0,0,.4)}
  body.win-closed .winglass{transform:translateX(0)}

  /* rain beads and slides down the closed glass */
  .glassdrops{position:absolute;inset:0;opacity:0;transition:opacity 1.5s ease;
    background-image:
      radial-gradient(2.5px 3.5px at 40px 60px,rgba(210,225,250,.5) 40%,rgba(210,225,250,.12) 70%,transparent 75%),
      radial-gradient(2px 3px at 120px 140px,rgba(210,225,250,.45) 40%,transparent 75%),
      radial-gradient(3px 4.5px at 220px 30px,rgba(210,225,250,.5) 40%,rgba(210,225,250,.1) 70%,transparent 75%),
      radial-gradient(1.8px 2.6px at 300px 180px,rgba(210,225,250,.4) 40%,transparent 75%),
      radial-gradient(2.2px 3.2px at 90px 240px,rgba(210,225,250,.45) 40%,transparent 75%),
      radial-gradient(2.8px 4px at 260px 260px,rgba(210,225,250,.5) 40%,transparent 75%),
      radial-gradient(1.6px 2.4px at 180px 90px,rgba(210,225,250,.35) 40%,transparent 75%);
    background-size:340px 300px;background-repeat:repeat;
    animation:dropslide 7s linear infinite}
  @keyframes dropslide{from{background-position-y:0}to{background-position-y:300px}}
  body.rain.win-closed .glassdrops{opacity:.65}

  /* the bus window — open hears the road, closed keeps just the music */
  .win-toggle{position:fixed;top:16px;right:16px;z-index:20;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:2px;
    padding:8px 12px;border:1px solid rgba(255,255,255,.14);border-radius:14px;
    background:rgba(255,255,255,.07);backdrop-filter:blur(14px);
    -webkit-user-select:none;user-select:none;transition:background .15s}
  .win-toggle:hover{background:rgba(255,255,255,.14)}
  .win-toggle:active{transform:scale(.95)}
  .win-lbl{font-size:10px;font-family:'Baloo Thambi 2',sans-serif;display:flex;gap:4px;align-items:center}
  .win-lbl span{color:rgba(255,255,255,.35);transition:color .3s}
  .win-lbl .w-sep{color:rgba(255,255,255,.25)}
  .win-lbl .on{color:var(--amber);text-shadow:0 0 6px rgba(255,176,0,.5)}
  .win-pane-l{transition:transform .5s ease}
  .win-toggle.open .win-pane-l{transform:translateX(11.5px)}
  .win-toggle.open .win-pane-r{fill:rgba(10,18,38,.9)}

  /* bus front destination sign — lights up with the active route */
  .bus-sign{position:fixed;top:56px;left:50%;transform:translate(-50%,-14px);z-index:20;
    background:#0a0a0a;border:1px solid #333;border-radius:9px;padding:7px 22px 6px;
    box-shadow:0 6px 24px rgba(0,0,0,.6),inset 0 0 18px rgba(0,0,0,.9);
    text-align:center;opacity:0;pointer-events:none;overflow:hidden;
    transition:opacity .9s ease,transform .9s ease}
  .bus-sign::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);pointer-events:none}
  .bus-sign.on{opacity:1;transform:translate(-50%,0)}
  .bus-sign .bs-board{font-family:'VT323',monospace;font-size:22px;letter-spacing:2px;white-space:nowrap;
    color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.9),0 0 24px rgba(255,176,0,.4);
    animation:flicker 4s infinite}
  .bus-sign .bs-tamil{font-family:'Baloo Thambi 2',sans-serif;font-size:13px;color:rgba(255,255,255,.75);margin-top:1px}

  /* ---------- HERO ---------- */
  .hero{position:relative;z-index:10;display:flex;flex-direction:column;align-items:center;
    margin-top:max(140px,13vh);padding:0 24px;text-align:center}
  .hero .tamil{font-family:'Baloo Thambi 2',sans-serif;font-weight:800;
    font-size:clamp(52px,11vw,110px);line-height:1.3;padding:.05em .1em;margin:-.05em 0;
    background:linear-gradient(180deg,#fff6df 20%,#ffc966 70%,#e89b1c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
    filter:drop-shadow(0 4px 24px rgba(255,176,0,.35)) drop-shadow(0 2px 6px rgba(0,0,0,.6));}
  .hero .latin{margin-top:2px;font-size:clamp(13px,2vw,17px);letter-spacing:.42em;text-indent:.42em;
    font-weight:600;color:rgba(255,255,255,.85);text-transform:uppercase}
  .hero .tag{margin-top:10px;font-size:clamp(12px,1.6vw,14px);color:rgba(255,255,255,.55);font-style:italic}
  .hero .odo{margin-top:9px;display:none}
  .hero .odo.on{display:block}
  .hero .odo-ta{font-size:12.5px;color:rgba(255,214,140,.6);font-variant-numeric:tabular-nums}
  .hero .odo-en{margin-top:1px;font-size:11px;font-style:italic;color:rgba(255,255,255,.38);font-variant-numeric:tabular-nums}

  /* ---------- CONDUCTOR'S CALL ---------- */
  .pick{position:relative;z-index:10;margin-top:4.5vh;text-align:center;padding:0 20px;
    transition:opacity .9s ease,transform .9s ease;user-select:none;-webkit-user-select:none;
    pointer-events:none}
  .pick-tamil{font-family:'Baloo Thambi 2',sans-serif;font-weight:700;
    font-size:clamp(17px,2.4vw,22px);color:rgba(255,255,255,.88);
    text-shadow:0 2px 10px rgba(0,0,0,.6)}
  .pick-en{margin-top:4px;font-size:14.5px;font-weight:600;letter-spacing:.14em;text-indent:.14em;
    color:rgba(255,214,140,.95);
    text-shadow:0 0 12px rgba(255,176,0,.45),0 1px 4px rgba(0,0,0,.6);
    animation:promptpulse 2.8s ease-in-out infinite}
  @keyframes promptpulse{0%,100%{opacity:.65}50%{opacity:1}}
  .pick.hidden{opacity:0;transform:translateY(-6px);pointer-events:none}

  /* ---------- ROUTE BOARD TOGGLE ---------- */
  .routes{position:relative;z-index:10;margin-top:2.2vh;display:flex;justify-content:center;gap:14px;
    padding:0 20px calc(170px + 6vh);flex-wrap:wrap} /* bottom clearance so the last board scrolls above the fixed player */
  .route-btn{cursor:pointer;border:none;border-radius:10px;padding:10px 18px 8px;
    background:#0a0a0a;border:1px solid #2a2a2a;
    box-shadow:0 4px 20px rgba(0,0,0,.6),inset 0 0 18px rgba(0,0,0,.9);
    display:flex;flex-direction:column;align-items:center;gap:2px;min-width:190px;
    transition:.2s;position:relative;overflow:hidden}
  .route-btn::after{content:'';position:absolute;inset:0;
    background:repeating-linear-gradient(0deg,rgba(0,0,0,.25) 0 1px,transparent 1px 3px);pointer-events:none}
  .route-btn .board{font-family:'VT323',monospace;font-size:26px;letter-spacing:2px;
    color:var(--amber-dim);text-shadow:none;transition:.2s;white-space:nowrap}
  .route-btn .sub{font-family:'Baloo Thambi 2',sans-serif;font-size:13px;color:rgba(255,255,255,.35);transition:.2s}
  .route-btn:hover{border-color:#3d3d3d}
  .route-btn.active{border-color:rgba(255,176,0,.55)}
  .route-btn.active .board{color:var(--amber);text-shadow:0 0 8px rgba(255,176,0,.9),0 0 24px rgba(255,176,0,.4);animation:flicker 4s infinite}
  .route-btn.active .sub{color:rgba(255,255,255,.75)}
  @keyframes flicker{0%,93%,95%,100%{opacity:1}94%{opacity:.6}}

  /* ---------- PLAYER ---------- */
  .player-wrap{position:fixed;left:0;right:0;bottom:max(4vh,20px);z-index:20;display:flex;justify-content:center;padding:0 20px}
  .player{display:flex;align-items:center;gap:22px;
    border-radius:999px;padding:16px 22px 16px 18px;
    background:rgba(255,255,255,.09);backdrop-filter:blur(24px) saturate(150%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:0 8px 40px rgba(0,0,0,.5),inset 0 1px 0 rgba(255,255,255,.22)}

  /* ---- audio cassette ---- */
  .cassette{position:relative;width:186px;height:114px;flex-shrink:0;filter:drop-shadow(0 6px 16px rgba(0,0,0,.5))}
  .shell{position:absolute;inset:0;border-radius:9px;
    background:linear-gradient(150deg,#2e3340 0%,#1a1e29 55%,#12151f 100%);
    border:1px solid rgba(255,255,255,.18);
    box-shadow:inset 0 1px 0 rgba(255,255,255,.15),inset 0 -6px 14px rgba(0,0,0,.5)}
  .screw{position:absolute;width:6px;height:6px;border-radius:50%;
    background:radial-gradient(circle at 35% 35%,#8a93a6,#3a404e 70%);box-shadow:inset 0 0 2px #000}
  .screw.s1{top:5px;left:5px}.screw.s2{top:5px;right:5px}
  .screw.s3{bottom:5px;left:5px}.screw.s4{bottom:5px;right:5px}
  .clabel{position:absolute;left:14px;right:14px;top:11px;height:62px;border-radius:5px;
    background:linear-gradient(180deg,#f7ecd4 0%,#eddcb4 100%);

/* ============================================================ */

const $ = id => document.getElementById(id);

// volume (persisted across visits)
let vol = Math.max(0, Math.min(100, +(localStorage.getItem('kb_vol') ?? 80) || 0));
let lastVideoId = null;
let kickTimer = null;

// clock
function tick(){
  const d = new Date();
  let h = d.getHours(), m = String(d.getMinutes()).padStart(2,'0');
  // the depot board tells the truth: காலை 5-12, பகல் 12-5, மாலை 5-8, இரவு 8-5
  $('svc').textContent = (h >= 20 || h < 5) ? 'இரவு சேவை'
    : (h < 12) ? 'காலை சேவை'
    : (h < 17) ? 'பகல் சேவை' : 'மாலை சேவை';
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12 || 12;
  $('clock').textContent = `${h}:${m} ${ap}`;
}
tick(); setInterval(tick, 1000);

// route buttons (the midnight route comes and goes with the clock)
let activeRoute = null;
const routesEl = $('routes');
const visibleRoutes = () => ROUTES.filter(r => !r.visible || r.visible());
let routesSig = '';
function renderRoutes(){
  routesSig = visibleRoutes().map(r => r.key).join();
  routesEl.innerHTML = '';
  ROUTES.forEach(r => { r._btn = null; });
  visibleRoutes().forEach(r => {
    const b = document.createElement('button');

    b.setAttribute('aria-selected', activeRoute === r ? 'true' : 'false');
    b.innerHTML = `<span class="board">${r.board}</span><span class="sub">${r.sub}</span>`;
    b.addEventListener('click', () => boardRoute(r, b));
    routesEl.appendChild(b);
    r._btn = b;
  });
}
renderRoutes();
setInterval(() => {
  if (visibleRoutes().map(r => r.key).join() !== routesSig) renderRoutes();
}, 30000);

// ---- synthesized sound effects (no audio files) ----
const sfx = (() => {
  let c = null;
  const ctx = () => {
    c = c || new (window.AudioContext || window.webkitAudioContext)();
    if (c.state === 'suspended') c.resume();
    return c;
  };
  const master = () => (vol / 100) * 0.6;
  function tone(freq, t0, dur, type, peak){
    const a = ctx(), o = a.createOscillator(), g = a.createGain();
    o.type = type; o.frequency.value = freq;
    const t = a.currentTime + t0;
    g.gain.setValueAtTime(0, t);
    g.gain.linearRampToValueAtTime(peak * master(), t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(a.destination);
    o.start(t); o.stop(t + dur + 0.05);
  }
  function noise(t0, dur, freq, peak, type){
    const a = ctx(), len = Math.ceil(a.sampleRate * dur);
    const buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    const s = a.createBufferSource(); s.buffer = buf;
    const f = a.createBiquadFilter(); f.type = type || 'lowpass'; f.frequency.value = freq;
    const g = a.createGain();
    const t = a.currentTime + t0;
    g.gain.setValueAtTime(peak * master(), t);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    s.connect(f).connect(g).connect(a.destination);
    s.start(t);
  }
  // --- continuous ambience: engine, rain patter, crickets ---
  let engineN = null, engineOn = false;
  let patterN = null, patterOn = false;
  let cricketT = null, crBellT = null;
  function engineSet(on){
    if (on === engineOn) return;
    engineOn = on;
    const a = ctx();
    if (on && !engineN){
      const len = a.sampleRate * 2, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      let last = 0;
      for (let i = 0; i < len; i++){ last = (last + 0.025 * (Math.random() * 2 - 1)) / 1.025; d[i] = last * 4; }
      const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 100;
      const throb = a.createGain(); throb.gain.value = .85;
      const lfo = a.createOscillator(); lfo.frequency.value = 8.5; // diesel idle throb
      const lfog = a.createGain(); lfog.gain.value = .15;
      lfo.connect(lfog); lfog.connect(throb.gain);
      const g = a.createGain(); g.gain.value = 0;
      src.connect(lp); lp.connect(throb); throb.connect(g); g.connect(a.destination);
      src.start(); lfo.start();
      engineN = g;
    }
    if (engineN){
      engineN.gain.cancelScheduledValues(a.currentTime);
      engineN.gain.setTargetAtTime(on ? .055 * master() : .0001, a.currentTime, on ? .6 : .35);
    }
  }
  function patterSet(on){
    if (on === patterOn) return;
    patterOn = on;
    const a = ctx();
    if (on && !patterN){
      const len = a.sampleRate, buf = a.createBuffer(1, len, a.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
      const src = a.createBufferSource(); src.buffer = buf; src.loop = true;
      const hp = a.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 1400;
      const lp = a.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 5200;
      const g = a.createGain(); g.gain.value = 0;
      src.connect(hp); hp.connect(lp); lp.connect(g); g.connect(a.destination);
      src.start();
      patterN = g;
    }
    if (patterN){
      patterN.gain.cancelScheduledValues(a.currentTime);
      patterN.gain.setTargetAtTime(on ? .035 * master() : .0001, a.currentTime, .8);
    }
  }
  function cricketsSet(on){
    if (on && !cricketT){
      cricketT = setInterval(() => {
        if (Math.random() < .45)
          for (let k = 0; k < 3; k++) tone(4300 + Math.random() * 200, k * .055, .02, 'sine', .04);
      }, 420);
    } else if (!on && cricketT){ clearInterval(cricketT); cricketT = null; }
  }
  function crossingBell(on){
    if (on && !crBellT){
      crBellT = setInterval(() => { tone(872, 0, .13, 'square', .06); tone(1308, 0, .09, 'sine', .02); }, 480);
    } else if (!on && crBellT){ clearInterval(crBellT); crBellT = null; }
  }
  function trainHorn(){
    const a = ctx();
    [311, 392].forEach(f => {
      const o = a.createOscillator(), g = a.createGain(), lp = a.createBiquadFilter();
      o.type = 'sawtooth'; o.frequency.value = f;
      lp.type = 'lowpass'; lp.frequency.value = 900;
      const t = a.currentTime;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(.05 * master(), t + .08);
      g.gain.setValueAtTime(.05 * master(), t + .85);
      g.gain.exponentialRampToValueAtTime(.0001, t + 1.25);
      o.connect(lp); lp.connect(g); g.connect(a.destination);
      o.start(t); o.stop(t + 1.3);
    });
  }
  return {
    board(){ // door hiss, conductor's double bell, then the ticket punch
      noise(0, 0.5, 900, 0.5);
      tone(988, 0.5, 0.55, 'triangle', 0.32); tone(1319, 0.52, 0.4, 'sine', 0.12);
      tone(988, 0.82, 0.6, 'triangle', 0.28); tone(1319, 0.84, 0.4, 'sine', 0.1);
      noise(1.18, 0.035, 2600, 0.4, 'highpass');
      noise(1.28, 0.05, 1400, 0.5, 'bandpass');
    },
    kachunk(){ noise(0, 0.07, 320, 0.8); noise(0.06, 0.06, 150, 0.6); },
    stopBell(){ tone(988, 0, 0.7, 'triangle', 0.14); },
    thunder(){ // distant rumble, arrives after the flash
      noise(1.4, 1.8, 90, 0.22); noise(1.9, 2.4, 70, 0.16);
    },
    templeBell(){ tone(523, 0, 2.2, 'sine', .06); tone(1046, .02, 1.4, 'sine', .025); tone(1570, .03, .8, 'sine', .012); },
    windowSlide(){ noise(0, .16, 600, .3, 'bandpass'); noise(.14, .05, 220, .5); },
    trainRumble(){ noise(0, 5, 140, .3); },
    engineSet, patterSet, cricketsSet, crossingBell, trainHorn,
    ready(){ return !!(c && c.state === 'running'); },
  };
})();
const PLAIN = new URLSearchParams(location.search).has('plain'); // ?plain silences ambience for A/B

// the bus window: open = engine hum & rain reach you; closed = just the music.
// Episodic sounds (bells, crickets, crossings) come through either way.
let windowOpen = localStorage.getItem('kb_window') !== 'closed';
const winBtn = document.getElementById('winToggle');
function renderWindow(){
  winBtn.classList.toggle('open', windowOpen);
  document.body.classList.toggle('win-closed', !windowOpen);

  document.getElementById('wOpen').classList.toggle('on', !windowOpen);
  document.getElementById('wClose').classList.toggle('on', windowOpen);

}
renderWindow();
function toggleWindow(){
  windowOpen = !windowOpen;
  localStorage.setItem('kb_window', windowOpen ? 'open' : 'closed');
  renderWindow();
  if (sfx.ready() && !PLAIN) sfx.windowSlide();
}
winBtn.addEventListener('click', toggleWindow);
document.getElementById('latchL').addEventListener('click', toggleWindow);
document.getElementById('latchR').addEventListener('click', toggleWindow);

// YouTube IFrame API
let player = null, ready = false, pendingRoute = null;

const tag = document.createElement('script');
tag.src = 'https://www.youtube.com/iframe_api';
document.head.appendChild(tag);

window.onYouTubeIframeAPIReady = function(){
  window._player = player = new YT.Player('yt', {
    width: 1, height: 1,
    playerVars: { playsinline: 1, autoplay: 0, controls: 0 },
    events: {
      onReady(){
        ready = true;
        try { player.setVolume(vol); } catch(e){}
        if (pendingRoute) boardRoute(pendingRoute, pendingRoute._btn);
      },
      onStateChange(e){
        const playing = e.data === YT.PlayerState.PLAYING;
        $('cassette').classList.toggle('playing', playing);
        document.body.classList.toggle('moving', playing);
        setPlayIcon(playing);
      },
      onError(){ player.nextVideo(); }, // skip unplayable/region-blocked videos
    },
  });
};

function boardRoute(r, btn){
  if (!ready){ pendingRoute = r; markActive(r, btn); return; }
  const isSwap = !!activeRoute && activeRoute !== r;
  markActive(r, btn);
  sfx.board();
  // one பயணம் on the odometer per visiting session
  if (!sessionStorage.getItem('kb_rode')){
    sessionStorage.setItem('kb_rode', '1');
    try {
      if (liveWS && liveWS.readyState === 1) liveWS.send('ride');
      else fetch(RIDERS_ENDPOINT + '/ride').catch(() => {});
    } catch(e){}
  }
  const cas = $('cassette');
  const load = () => {
    lastVideoId = null;
    // Start playback inside the click's autoplay grace window — no delayed song-jump,
    // or fresh visitors get a silently paused player.
    // Route sources, most to least controlled:
    //   videos: [...]  — explicit video IDs, identical for every rider (preferred)
    //   PL… playlist   — curated YouTube playlist, boards at a random point
    //   RD… mix        — YouTube auto-radio; PERSONALIZED per viewer, can drift
    //                    off-language/era. Avoid for routes that promise a sound.
    const isMix = !r.videos && r.playlist.startsWith('RD');
    if (r.videos){
      player.loadPlaylist(r.videos, Math.floor(Math.random() * r.videos.length));
    } else {
      const idx = (!isMix && r.length) ? Math.floor(Math.random() * r.length) : 0;
      player.loadPlaylist({ listType: 'playlist', list: r.playlist, index: idx });
    }
    // once ingested: always loop; shuffle everything except mixes (radio keeps its order)
    setTimeout(() => { try { player.setLoop(true); if (!isMix) player.setShuffle(true); } catch(e){} }, 1200);
    // mixes can ingest slowly and land paused — keep nudging until playback actually starts
    clearInterval(kickTimer);
    let kicks = 0;
    kickTimer = setInterval(() => {
      kicks++;
      try {
        const s = player.getPlayerState();
        if (s === 1 || kicks > 12){ clearInterval(kickTimer); return; }
        if (s !== 3) player.playVideo(); // 3 = buffering, leave it alone
      } catch(e){}
    }, 800);
  };
  const insert = () => {
    cas.classList.remove('eject');
    cas.classList.add('insert');
    setTimeout(() => sfx.kachunk(), 380);
    setTimeout(() => cas.classList.remove('insert'), 600);
    load();
  };
  if (isSwap){
    try { player.pauseVideo(); } catch(e){}
    cas.classList.add('eject');
    setTimeout(insert, 400);
  } else {
    insert();
  }
}

function markActive(r, btn){
  activeRoute = r;
  ROUTES.forEach(x => {
    document.body.classList.remove('theme-' + x.key);
    if (x._btn){ x._btn.classList.remove('active'); x._btn.setAttribute('aria-selected','false'); }
  });
  document.body.classList.add('theme-' + r.key);
  btn.classList.add('active');
  btn.setAttribute('aria-selected','true');
  $('bsBoard').textContent = 'ROUTE ' + r.board;
  $('bsTamil').textContent = r.sub.split('—')[0].trim();
  $('busSign').classList.add('on');
  const pick = $('pickPrompt');
  pick.classList.add('hidden');
  setTimeout(() => { pick.style.display = 'none'; }, 950); // reclaim its space after the fade
}

function setPlayIcon(playing){
  $('playIcon').innerHTML = playing
    ? '<path d="M6 5h4v14H6zM14 5h4v14h-4z"/>'
    : '<path d="M8 5v14l11-7z"/>';
  $('play').setAttribute('aria-pressed', playing);
  $('play').setAttribute('aria-label', playing ? 'Pause' : 'Play');
}

// controls
$('play').addEventListener('click', () => {
  if (!ready) return;
  if (!activeRoute){ boardRoute(ROUTES[0], ROUTES[0]._btn); return; }
  const s = player.getPlayerState();
  if (s === YT.PlayerState.PLAYING){ clearInterval(kickTimer); player.pauseVideo(); } else player.playVideo();
});
// keep the cassette reels and play icon in sync with actual playback,
// and ring a soft bell when the bus moves on to the next song
setInterval(() => {
  if (!ready || !player.getPlayerState) return;
  const playing = player.getPlayerState() === 1;
  $('cassette').classList.toggle('playing', playing);
  document.body.classList.toggle('moving', playing);
  setPlayIcon(playing);
  if (!PLAIN && sfx.ready()){
    sfx.engineSet(playing && windowOpen);
    sfx.patterSet(windowOpen && document.body.classList.contains('rain'));
    sfx.cricketsSet(playing && document.body.classList.contains('zone-country'));
  }
  const d = player.getVideoData && player.getVideoData();
  if (playing && d && d.video_id){
    if (lastVideoId && lastVideoId !== d.video_id) sfx.stopBell();
    lastVideoId = d.video_id;
  }
}, 500);

// rotary volume knob — drag to turn, or scroll over it.
// iOS forbids web pages from setting media volume (hardware buttons only),
// so the knob would spin without effect there — hide it.
const knob = $('vol');
const isIOS = /iPhone|iPad|iPod/.test(navigator.userAgent)
  || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
if (isIOS) knob.style.display = 'none';
function applyVol(){
  knob.style.setProperty('--rot', (-135 + vol * 2.7) + 'deg');
  knob.setAttribute('aria-valuenow', vol);
  localStorage.setItem('kb_vol', vol);
  if (ready){ try { player.setVolume(vol); } catch(e){} }
}
applyVol();
function setVol(v){ vol = Math.max(0, Math.min(100, Math.round(v))); applyVol(); }
let turning = false;
function turnVol(e){
  const r = knob.getBoundingClientRect();
  const a = Math.atan2(e.clientX - (r.left + r.width/2), (r.top + r.height/2) - e.clientY) * 180 / Math.PI;
  setVol((Math.max(-135, Math.min(135, a)) + 135) / 2.7);
}
knob.addEventListener('pointerdown', e => { turning = true; knob.setPointerCapture(e.pointerId); turnVol(e); });
knob.addEventListener('pointermove', e => { if (turning) turnVol(e); });
knob.addEventListener('pointerup', () => { turning = false; });
knob.addEventListener('wheel', e => { e.preventDefault(); setVol(vol + (e.deltaY < 0 ? 5 : -5)); }, { passive: false });

// some nights it rains on the route (force with ?rain in the URL)
if (new URLSearchParams(location.search).has('rain') || Math.random() < 0.2)
  document.body.classList.add('rain');

// lightning on rain nights: sky flash, sometimes a bolt, distant thunder
(function scheduleLightning(){
  setTimeout(() => {
    if (document.body.classList.contains('rain')){
      const L = $('lightning');
      L.classList.remove('flash'); void L.offsetWidth; L.classList.add('flash');
      if (Math.random() < 0.5){
        const b = $('bolt');
        b.style.left = (12 + Math.random() * 72) + 'vw';
        b.classList.remove('strike'); void b.offsetWidth; b.classList.add('strike');
      }
      if (sfx.ready()) sfx.thunder(); // only audible once the rider has interacted
    }
    scheduleLightning();
  }, 9000 + Math.random() * 17000);
})();

// the journey: city → open country → a village → country → city again.
// The leg clock only ticks while the bus is actually moving.
const JOURNEY = [['city', 55], ['country', 40], ['village', 32], ['country', 36]];
let leg = 0, legElapsed = 0;
setInterval(() => {
  if (!document.body.classList.contains('moving')) return;
  if (++legElapsed >= JOURNEY[leg][1]){
    legElapsed = 0;
    leg = (leg + 1) % JOURNEY.length;
    document.body.classList.remove('zone-city','zone-country','zone-village');
    if (JOURNEY[leg][0] !== 'city') document.body.classList.add('zone-' + JOURNEY[leg][0]);
    if (JOURNEY[leg][0] === 'village' && !PLAIN && sfx.ready())
      setTimeout(() => sfx.templeBell(), 4000 + Math.random() * 8000);
  }
}, 1000);

// the level crossing — a rare set piece. The bus halts at the gate, a night
// train clatters across with lit windows, the gate lifts, the ride goes on.
// Force an early one with ?crossing in the URL.
const CROSSING_TEST = new URLSearchParams(location.search).has('crossing');
let crossingActive = false, crossingTimer = null;
function scheduleCrossing(delayMs){
  clearTimeout(crossingTimer);
  crossingTimer = setTimeout(tryCrossing, delayMs);
}
function tryCrossing(){
  if (crossingActive || !document.body.classList.contains('moving')){
    scheduleCrossing(45000);
    return;
  }
  crossingActive = true;
  const gate = $('crossing'), train = $('train');
  const sound = !PLAIN && sfx.ready();
  gate.classList.add('in');
  if (sound) sfx.crossingBell(true);
  setTimeout(() => gate.classList.add('closed'), 1400);
  setTimeout(() => document.body.classList.add('halted'), 2300);
  setTimeout(() => { if (sound) sfx.trainHorn(); }, 3000);
  setTimeout(() => {
    train.classList.add(Math.random() < .5 ? 'rtl' : 'ltr');
    if (sound) sfx.trainRumble();
  }, 3800);
  setTimeout(() => train.classList.remove('rtl','ltr'), 9600);
  setTimeout(() => { sfx.crossingBell(false); gate.classList.remove('closed'); }, 9800);
  setTimeout(() => { document.body.classList.remove('halted'); gate.classList.add('out'); }, 11200);
  setTimeout(() => {
    gate.classList.remove('in','out');
    crossingActive = false;
    scheduleCrossing(420000 + Math.random() * 480000); // next one in 7-15 min
  }, 13500);
}
scheduleCrossing(CROSSING_TEST ? 8000 : 240000 + Math.random() * 300000);

// oncoming traffic passes every so often
(function schedulePass(){
  setTimeout(() => {
    const t = $('traffic');
    t.classList.add('pass');
    setTimeout(() => t.classList.remove('pass'), 1900);
    schedulePass();
  }, 16000 + Math.random() * 16000);
})();

// riders on board (live over WebSocket, polling fallback) + lifetime odometer
const RIDERS_ENDPOINT = 'https://kadaisi-bus-production.up.railway.app';
let liveWS = null, wsOk = false;
if (RIDERS_ENDPOINT){
  const rid = (window.crypto && crypto.randomUUID)
    ? crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);
  const show = d => {
    if (d && d.riders)
      $('riders').textContent = `· ${d.riders} ${d.riders === 1 ? 'பயணி' : 'பயணிகள்'}`;
    if (d && d.rides){
      const n = d.rides.toLocaleString('en-IN');
      $('odoTa').textContent = `இதுவரை பயணித்தவர்கள்: ${n}`;
      $('odoEn').textContent = `${n} ${d.rides === 1 ? 'soul' : 'souls'} carried home`;
      $('odometer').classList.add('on');
    }
  };
  const beat = () => {
    if (wsOk) return; // socket is live — the server pushes instead
    fetch(`${RIDERS_ENDPOINT}/beat?id=${rid}`).then(r => r.json()).then(show).catch(() => {});
  };
  (function connect(){
    let s;
    try { s = new WebSocket(RIDERS_ENDPOINT.replace(/^http/, 'ws') + '/ws'); } catch(e){ return; }
    liveWS = s;
    s.onopen = () => { wsOk = true; };
    s.onmessage = e => { try { show(JSON.parse(e.data)); } catch(err){} };
    s.onclose = () => { wsOk = false; setTimeout(connect, 3000 + Math.random() * 5000); };
    s.onerror = () => { try { s.close(); } catch(e){} };
  })();
  beat();
  setTimeout(beat, 4000);
  setInterval(beat, 15000);
  document.addEventListener('visibilitychange', () => { if (!document.hidden) beat(); });
}

// installable app shell (https + localhost only)
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost'))
  navigator.serviceWorker.register('sw.js').catch(() => {});

// spacebar toggles play
document.addEventListener('keydown', e => {
  if (e.code === 'Space' && e.target === document.body){ e.preventDefault(); $('play').click(); }
});
</script>
